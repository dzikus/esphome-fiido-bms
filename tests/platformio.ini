; Unit tests for components/fiido_bms - run from the tests/ directory:
;   pio test -e native
;
; Tests are pure C++ (no esphome dependencies) and run on the host, not the ESP32.
; The pure functions in fiido_protocol.cpp are pulled in directly.

[platformio]
test_dir = .

[env:native]
platform = native
test_framework = unity
test_filter = test_*
build_flags =
    -std=gnu++17
    -I ../components/fiido_bms
