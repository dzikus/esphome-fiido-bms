; Unit tests for components/fiido_bms - run from the tests/ directory:
;   pio test -e native
;
; Tests are pure C++ (no esphome dependencies) and run on the host, not the ESP32.

[platformio]
test_dir = .
src_dir = ../components/fiido_bms

[env:native]
platform = native
test_framework = unity
test_filter = test_*
test_build_src = yes
build_src_filter =
    +<fiido_protocol.cpp>
    +<fiido_state.cpp>
build_flags =
    -std=gnu++20
    -Wall
    -Wextra
    -Werror
    -I ../components/fiido_bms
