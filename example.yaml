# Minimal single-bike example for the fiido_bms external component.
# Replace the MAC with your bike's BLE MAC and flash with ESPHome.

esphome:
  name: fiido-bms
  # Sub-device API (per-entity device_id) requires ESPHome 2025.7.0 or newer.
  min_version: 2025.7.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://dzikus/esphome-fiido-bms@v1.1.0

esp32_ble_tracker:

ble_client:
  - id: ble_c11
    mac_address: XX:XX:XX:XX:XX:XX

fiido_bms:
  - id: hub_c11
    ble_client_id: ble_c11

sensor:
  - platform: fiido_bms
    fiido_bms_id: hub_c11

binary_sensor:
  - platform: fiido_bms
    fiido_bms_id: hub_c11

select:
  - platform: fiido_bms
    fiido_bms_id: hub_c11

switch:
  - platform: fiido_bms
    fiido_bms_id: hub_c11
