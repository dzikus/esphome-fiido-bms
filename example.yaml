# Minimal single-bike example for the fiido_bms external component.
# Copy it, fill in secrets.yaml, flash.

esphome:
  name: fiido-bms
  # select::Select::current_option returns StringRef from 2026.1.0.
  min_version: 2026.1.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Consuming the component as a package instead of a local clone:
#   external_components:
#     - source: github://dzikus/esphome-fiido-bms
external_components:
  - source:
      type: local
      path: components
    components: [fiido_bms]

esp32_ble_tracker:

ble_client:
  - id: ble_c11
    mac_address: !secret fiido_mac

fiido_bms:
  - id: hub_c11
    ble_client_id: ble_c11

sensor:
  - platform: fiido_bms
    fiido_bms_id: hub_c11

binary_sensor:
  - platform: fiido_bms
    fiido_bms_id: hub_c11

select:
  - platform: fiido_bms
    fiido_bms_id: hub_c11

switch:
  - platform: fiido_bms
    fiido_bms_id: hub_c11
