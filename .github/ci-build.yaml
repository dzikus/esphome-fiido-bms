# CI-only configuration that compiles the full component (all platforms, two
# hubs) so a build-breaking change in any source file fails CI. Not meant for
# flashing. Uses dummy BLE MACs; no device is contacted during compile.
esphome:
  name: ci-build
  # Sub-device API (per-entity device_id) requires ESPHome 2025.7.0 or newer.
  min_version: 2025.7.0
  devices:
    - id: dev_second
      name: "Second Bike"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

external_components:
  - source:
      type: local
      path: ../components
    components: [fiido_bms]

esp32_ble_tracker:

ble_client:
  - id: ble_test
    mac_address: AA:BB:CC:DD:EE:FF
  - id: ble_second
    mac_address: AA:BB:CC:DD:EE:F0

fiido_bms:
  - id: hub_test
    ble_client_id: ble_test
    name_prefix: ""
  - id: hub_second
    ble_client_id: ble_second
    name_prefix: "Second"
    expose_dev_sensors: true
    ui_gear_mode_3: true
    enforce_gear_mode_3: true

sensor:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second

binary_sensor:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second

select:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second

switch:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second

number:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second

button:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second
