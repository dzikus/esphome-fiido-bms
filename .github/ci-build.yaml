# CI-only configuration that compiles the full component (all platforms, two
# hubs) so a build-breaking change in any source file fails CI. Not meant for
# flashing. Uses dummy BLE MACs; no device is contacted during compile.

substitutions:
  board: esp32dev
  expose_dev: "true"

esphome:
  name: ci-build
  # select::Select::current_option arrived in 2025.11.0.
  min_version: 2025.11.0
  devices:
    - id: dev_second
      name: "Second Bike"

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:
  level: VERY_VERBOSE

external_components:
  - source:
      type: local
      path: ../components
    components: [fiido_bms]

esp32_ble_tracker:

ble_client:
  - id: ble_test
    mac_address: AA:BB:CC:DD:EE:FF
  - id: ble_second
    mac_address: AA:BB:CC:DD:EE:F0

fiido_bms:
  - id: hub_test
    ble_client_id: ble_test
    name_prefix: ""
  - id: hub_second
    ble_client_id: ble_second
    name_prefix: "Second"
    expose_dev_sensors: ${expose_dev}
    ui_gear_mode_3: true
    enforce_gear_mode_3: true

sensor:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second

binary_sensor:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second

select:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second

switch:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second

number:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second

button:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second
