# CI-only configuration that compiles the full component (all platforms, three
# hubs) so a build-breaking change in any source file fails CI. Not meant for
# flashing. Uses dummy BLE MACs; no device is contacted during compile.

substitutions:
  board: esp32dev
  expose_dev: "true"

esphome:
  name: ci-build
  # select::Select::current_option returns StringRef from 2026.1.0.
  min_version: 2026.1.0
  devices:
    - id: dev_second
      name: "Second Bike"
    - id: dev_air
      name: "Air Bike"

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:
  level: VERY_VERBOSE

external_components:
  - source:
      type: local
      path: ../components
    components: [fiido_bms]

esp32_ble_tracker:

ble_client:
  - id: ble_test
    mac_address: AA:BB:CC:DD:EE:FF
  - id: ble_second
    mac_address: AA:BB:CC:DD:EE:F0
  - id: ble_air
    mac_address: AA:BB:CC:DD:EE:F1

fiido_bms:
  - id: hub_test
    ble_client_id: ble_test
    name_prefix: ""
  - id: hub_second
    ble_client_id: ble_second
    model: m1_pro_2025
    name_prefix: "Second"
    expose_dev_sensors: ${expose_dev}
    ui_gear_mode_3: true
    enforce_gear_mode_3: true
  - id: hub_air
    ble_client_id: ble_air
    model: air
    name_prefix: "Air"
    expose_dev_sensors: ${expose_dev}

sensor:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second
  - platform: fiido_bms
    fiido_bms_id: hub_air
    device_id: dev_air

binary_sensor:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second
  - platform: fiido_bms
    fiido_bms_id: hub_air
    device_id: dev_air

select:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second
  - platform: fiido_bms
    fiido_bms_id: hub_air
    device_id: dev_air

switch:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second
  - platform: fiido_bms
    fiido_bms_id: hub_air
    device_id: dev_air

number:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second
  - platform: fiido_bms
    fiido_bms_id: hub_air
    device_id: dev_air

button:
  - platform: fiido_bms
    fiido_bms_id: hub_test
  - platform: fiido_bms
    fiido_bms_id: hub_second
    device_id: dev_second
  - platform: fiido_bms
    fiido_bms_id: hub_air
    device_id: dev_air
