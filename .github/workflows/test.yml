name: tests
on:
  push:
    branches: [main]
    paths: ["components/fiido_bms/**", "tests/**", ".github/**", "example.yaml", ".intellisense.yaml", "pyproject.toml", ".pre-commit-config.yaml"]
  pull_request:
    paths: ["components/fiido_bms/**", "tests/**", ".github/**", "example.yaml", ".intellisense.yaml", "pyproject.toml", ".pre-commit-config.yaml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: ruff + pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: ${{ runner.os }}-pre-commit-
      - name: Install pre-commit
        run: pip install "pre-commit==4.6.0"
      - name: Run pre-commit (ruff lint + format + hygiene)
        run: pre-commit run --all-files --show-diff-on-failure
  unit-tests:
    name: protocol unit tests (native)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('tests/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO
        run: pip install "platformio==6.1.19"
      - name: Run protocol unit tests
        run: |
          set -euo pipefail
          pio test -d tests -e native < /dev/null
          echo "--- re-run built binary as source of truth ---"
          tests/.pio/build/native/program
  clang-tidy:
    name: clang-tidy (esp32 compile database)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-esphome-esp32-c3-devkitm-1-${{ hashFiles('.github/ci-build.yaml') }}
          restore-keys: ${{ runner.os }}-esphome-esp32-c3-devkitm-1-
      - name: Install ESPHome and clang-tidy
        run: pip install "esphome==2026.7.4" "clang-tidy==22.1.8"
      - name: Run clang-tidy
        run: bash tests/run_clang_tidy.sh

  esphome-build:
    name: esphome compile (${{ matrix.board }})
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp32dev
          - esp32-s3-devkitc-1
          - esp32-c3-devkitm-1
          - esp32-c6-devkitc-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-esphome-${{ matrix.board }}-${{ hashFiles('.github/ci-build.yaml') }}
          restore-keys: ${{ runner.os }}-esphome-${{ matrix.board }}-
      - name: Install ESPHome
        run: pip install "esphome==2026.7.4"
      - name: Run codegen unit tests
        run: python -m unittest discover -s tests/python -v
      - name: Compile full component
        run: |
          set -euo pipefail
          esphome -s board ${{ matrix.board }} compile .github/ci-build.yaml
  config-floor:
    name: config check and build at the ESPHome floor
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Contemporary with the floor below: the 2025.8.0 dependency set has no
          # wheels for 3.14, so pip falls back to building Pillow from source.
          python-version: "3.12"
      # Pin to the declared floor so min_version is actually exercised.
      - name: Install ESPHome (component floor)
        run: pip install "esphome==2025.8.0"
      - name: Validate CI and IntelliSense configs
        run: |
          set -euo pipefail
          esphome config .github/ci-build.yaml
          esphome config .intellisense.yaml
      - name: Compile at the floor
        run: |
          set -euo pipefail
          esphome compile .github/ci-build.yaml
