name: tests
on:
  push:
    branches: [main]
    paths: ["components/fiido_bms/**", "tests/**", ".github/**", ".devcontainer/requirements.txt", "example.yaml", ".intellisense.yaml", "pyproject.toml", ".pre-commit-config.yaml", ".clang-format", ".clang-tidy"]
  pull_request:
    paths: ["components/fiido_bms/**", "tests/**", ".github/**", ".devcontainer/requirements.txt", "example.yaml", ".intellisense.yaml", "pyproject.toml", ".pre-commit-config.yaml", ".clang-format", ".clang-tidy"]
  workflow_call:
  workflow_dispatch:
permissions: {}
env:
  ESPHOME_FLOOR: "2026.1.0"
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: ruff + pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version pins against .devcontainer/requirements.txt
        run: |
          set -euo pipefail
          rev_of() { grep -A1 "$1" .pre-commit-config.yaml | sed -n 's/^ *rev: v//p'; }
          for pin in "ruff==$(rev_of astral-sh/ruff-pre-commit)" \
                     "clang-format==$(rev_of mirrors-clang-format)"; do
            grep -qx "${pin}" .devcontainer/requirements.txt \
              || { echo "${pin} is not in .devcontainer/requirements.txt" >&2; exit 1; }
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Restore the pip and pre-commit caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pre-commit
          key: ${{ runner.os }}-py3.14-lint-${{ hashFiles('.devcontainer/requirements.txt', '.pre-commit-config.yaml') }}
          restore-keys: ${{ runner.os }}-py3.14-lint-
      - name: Install pre-commit
        run: |
          set -euo pipefail
          pin="$(grep -E '^pre-commit==' .devcontainer/requirements.txt)"
          pip install "${pin}"
      - name: Run pre-commit (ruff lint + format + hygiene)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Save the pip and pre-commit caches
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.cache/pre-commit
          key: ${{ steps.cache.outputs.cache-primary-key }}
  unit-tests:
    name: protocol unit tests (native)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Restore the pip and PlatformIO caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-py3.14-unit-tests-${{ hashFiles('.devcontainer/requirements.txt', 'tests/platformio.ini') }}
          restore-keys: ${{ runner.os }}-py3.14-unit-tests-
      - name: Install PlatformIO
        run: |
          set -euo pipefail
          pin="$(grep -E '^platformio==' .devcontainer/requirements.txt)"
          pip install "${pin}"
      - name: Run protocol unit tests
        run: |
          set -euo pipefail
          # The wrapper exits on SIGHUP and reports ERRORED on a green run, so
          # its status is not the answer. The binary it built is.
          pio test -d tests -e native < /dev/null || echo "pio wrapper rc=$?, binary decides"
          tests/.pio/build/native/program | tee test-output.txt
          # rc=0 without the closing line means the binary stopped early.
          grep -qE '^[1-9][0-9]* Tests 0 Failures 0 Ignored' test-output.txt
      - name: Compile the esphome-free layers under strict warnings
        run: |
          set -euo pipefail
          strict=(-std=gnu++20 -fsyntax-only -Werror -Wall -Wextra -Wconversion
                  -Wsign-conversion -Wshadow -Wold-style-cast -I components/fiido_bms)
          g++ "${strict[@]}" components/fiido_bms/fiido_protocol.cpp
          g++ "${strict[@]}" components/fiido_bms/fiido_state.cpp
          # A header given as the main file trips #pragma once under -Werror.
          g++ "${strict[@]}" -x c++ - <<< '#include "fiido_model.h"'
      - name: Save the pip and PlatformIO caches
        if: github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ steps.cache.outputs.cache-primary-key }}
  clang-tidy:
    name: clang-tidy (esp32 compile database)
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Resolve the ESPHome pin from .devcontainer/requirements.txt
        run: |
          set -euo pipefail
          version="$(sed -n 's/^esphome==//p' .devcontainer/requirements.txt)"
          [ -n "${version}" ] || { echo "no esphome== pin in .devcontainer/requirements.txt" >&2; exit 1; }
          echo "ESPHOME_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Restore the pip cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.14-clang-tidy-${{ hashFiles('.devcontainer/requirements.txt') }}
          restore-keys: ${{ runner.os }}-py3.14-clang-tidy-
      - name: Restore the ESP-IDF framework cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
            !~/.cache/esphome/idf/dist
            !~/.cache/esphome/idf/tools/xtensa-esp-elf
            !~/.cache/esphome/idf/tools/xtensa-esp-elf-gdb
            !~/.cache/esphome/idf/tools/esp32ulp-elf
            !~/.cache/esphome/idf/tools/riscv32-esp-elf
            !~/.cache/esphome/idf/tools/riscv32-esp-elf-gdb
          key: ${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}-base
      - name: Restore the riscv toolchain cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cache/esphome/idf/tools/riscv32-esp-elf
            ~/.cache/esphome/idf/tools/riscv32-esp-elf-gdb
          key: ${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}-riscv
      - name: Install ESPHome and clang-tidy
        run: |
          set -euo pipefail
          pin="$(grep -E '^clang-tidy==' .devcontainer/requirements.txt)"
          pip install "esphome==${ESPHOME_VERSION}" "${pin}"
      - name: Run clang-tidy over both variants
        run: |
          set -euo pipefail
          CI_CONFIG=.github/ci-build.yaml EXPOSE_DEV=true bash tests/run_clang_tidy.sh
          CI_CONFIG=.github/ci-build.yaml EXPOSE_DEV=false bash tests/run_clang_tidy.sh
      - name: Save the pip cache
        if: github.ref == 'refs/heads/main' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
  esphome-build:
    name: esphome compile (${{ matrix.arch }})
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: xtensa
            boards: esp32dev esp32-s3-devkitc-1
            toolchains: |
              ~/.cache/esphome/idf/tools/xtensa-esp-elf
              ~/.cache/esphome/idf/tools/xtensa-esp-elf-gdb
              ~/.cache/esphome/idf/tools/esp32ulp-elf
          - arch: riscv
            boards: esp32-c3-devkitm-1 esp32-c6-devkitc-1
            toolchains: |
              ~/.cache/esphome/idf/tools/riscv32-esp-elf
              ~/.cache/esphome/idf/tools/riscv32-esp-elf-gdb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
      - name: Resolve the ESPHome pin from .devcontainer/requirements.txt
        run: |
          set -euo pipefail
          version="$(sed -n 's/^esphome==//p' .devcontainer/requirements.txt)"
          [ -n "${version}" ] || { echo "no esphome== pin in .devcontainer/requirements.txt" >&2; exit 1; }
          echo "ESPHOME_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Restore the pip cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.14-esphome-${{ env.ESPHOME_VERSION }}
      - name: Restore the ESP-IDF framework cache
        id: base-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
            !~/.cache/esphome/idf/dist
            !~/.cache/esphome/idf/tools/xtensa-esp-elf
            !~/.cache/esphome/idf/tools/xtensa-esp-elf-gdb
            !~/.cache/esphome/idf/tools/esp32ulp-elf
            !~/.cache/esphome/idf/tools/riscv32-esp-elf
            !~/.cache/esphome/idf/tools/riscv32-esp-elf-gdb
          key: ${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}-base
      - name: Restore the ${{ matrix.arch }} toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ matrix.toolchains }}
          key: ${{ runner.os }}-esphome-${{ env.ESPHOME_VERSION }}-${{ matrix.arch }}
      - name: Install ESPHome
        run: pip install "esphome==${ESPHOME_VERSION}"
      - name: Run codegen unit tests
        run: python -m unittest discover -s tests/python -v
      - name: Compile every board and variant, failing on any warning from the component
        run: |
          set -euo pipefail
          for board in ${{ matrix.boards }}; do
            bash tests/check_esp32_warnings.sh .github/ci-build.yaml "$board" true
            bash tests/check_esp32_warnings.sh .github/ci-build.yaml "$board" false
          done
      - name: Save the pip cache
        if: github.ref == 'refs/heads/main' && matrix.arch == 'xtensa' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - name: Save the ESP-IDF framework cache
        if: github.ref == 'refs/heads/main' && matrix.arch == 'xtensa' && steps.base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
            !~/.cache/esphome/idf/dist
            !~/.cache/esphome/idf/tools/xtensa-esp-elf
            !~/.cache/esphome/idf/tools/xtensa-esp-elf-gdb
            !~/.cache/esphome/idf/tools/esp32ulp-elf
            !~/.cache/esphome/idf/tools/riscv32-esp-elf
            !~/.cache/esphome/idf/tools/riscv32-esp-elf-gdb
          key: ${{ steps.base-cache.outputs.cache-primary-key }}
      - name: Save the ${{ matrix.arch }} toolchain cache
        if: github.ref == 'refs/heads/main' && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ matrix.toolchains }}
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}
  config-build-floor:
    name: config check and build at the ESPHome floor
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Contemporary with the floor below: the 2026.1.0 dependency set has no
          # wheels for 3.14, so pip falls back to building Pillow from source.
          python-version: "3.12"
      # Pin to the declared floor so min_version is actually exercised, and
      # validate the published example (which the compile job never touches).
      - name: Restore the pip cache
        id: pip-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-py3.12-esphome-${{ env.ESPHOME_FLOOR }}
      - name: Restore the ESP-IDF toolchain cache
        id: idf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-idf-${{ env.ESPHOME_FLOOR }}-xtensa
      - name: Install ESPHome (component floor)
        run: pip install "esphome==${ESPHOME_FLOOR}"
      - name: Provide dummy secrets for the example
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: ci
          wifi_password: ci-password-123
          api_encryption_key: cJlpAFA6N5wBzUgFSpMSo8QVMXZzKXwUBG6oHtGOb6Q=
          ota_password: ci-ota-password
          fiido_mac: AA:BB:CC:DD:EE:FF
          EOF
      - name: Validate example, CI and IntelliSense configs
        run: |
          set -euo pipefail
          esphome config example.yaml
          esphome config .github/ci-build.yaml
          esphome config .intellisense.yaml
      - name: Compile at the floor
        run: |
          set -euo pipefail
          esphome -s expose_dev true compile .github/ci-build.yaml
          esphome -s expose_dev false compile .github/ci-build.yaml
      - name: Save the pip cache
        if: github.ref == 'refs/heads/main' && steps.pip-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ steps.pip-cache.outputs.cache-primary-key }}
      - name: Save the ESP-IDF toolchain cache
        if: github.ref == 'refs/heads/main' && steps.idf-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: ${{ steps.idf-cache.outputs.cache-primary-key }}
