name: release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    name: test gate and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: pip install esphome
      - name: Run protocol unit tests (release gate)
        run: |
          set -euo pipefail
          pio test -d tests -e native < /dev/null
          echo "--- re-run built binary as source of truth ---"
          tests/.pio/build/native/program
      - name: Run codegen unit tests (release gate)
        run: python -m unittest discover -s tests/python -v
      - name: Compile full component (release gate)
        run: |
          set -euo pipefail
          esphome compile .github/ci-build.yaml
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
